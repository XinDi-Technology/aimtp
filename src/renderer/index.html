<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if (typeof global === 'undefined') {
        window.global = window;
      }
      window.MathJax = {
        tex: {
          packages: {
            '[+]': ['ams', 'newcommand', 'configmacros'],
          },
        },
        svg: {
          fontCache: 'local',
          dynamicPrefix: './mathjax-newcm-font/svg/dynamic',
        },
        loader: {
          paths: {
            // 脚本内部 loader.paths.fonts 默认指向 CDN，这里覆盖为本地路径
            // @mathjax/* 包会解析为 ./vendor/* （如 @mathjax/mathjax-newcm-font → ./vendor/mathjax-newcm-font）
            fonts: './vendor',
          },
          // 关闭版本警告，避免动态字体组件文件（无版本字段）产生大量 console.warn
          versionWarnings: false,
        },
        options: {
          // 本应用不需要语音朗读和盲文功能
          // enableSpeech/enableBraille 直接控制 Web Worker 的创建条件
          enableSpeech: false,
          enableBraille: false,
          menuOptions: {
            settings: {
              speech: false,
              braille: false,
            },
          },
        },
        startup: {
          typeset: false,
        },
      };
    </script>
    <!-- 字体不再 preload：
         打包后渲染进程走 file:// 协议，本地磁盘读取无网络延迟，preload 没有收益；
         且 file:// 下 <link rel="preload" crossorigin> 与 CSS @font-face 发起的字体请求
         credentials mode 不一致，preload 缓存条目无法复用，反而导致字体被下载两次，
         并在控制台产生 "credentials mode does not match" / "preloaded but not used" 警告。
         字体由 fonts.css 的 @font-face 正常加载即可。 -->
    <title>Aimtp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
