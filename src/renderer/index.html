<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if (typeof global === 'undefined') {
        window.global = window;
      }
      window.MathJax = {
        tex: {
          packages: {
            '[+]': ['ams', 'newcommand', 'configmacros'],
          },
        },
        svg: {
          fontCache: 'local',
          dynamicPrefix: './mathjax-newcm-font/svg/dynamic',
        },
        loader: {
          paths: {
            // 脚本内部 loader.paths.fonts 默认指向 CDN，这里覆盖为本地路径
            // @mathjax/* 包会解析为 ./vendor/* （如 @mathjax/mathjax-newcm-font → ./vendor/mathjax-newcm-font）
            fonts: './vendor',
          },
        },
        startup: {
          typeset: false,
        },
      };
    </script>
    <title>Aimtp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
